<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 栖舍</title>
  <link th:href="@{/css/front.css}" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="brand" th:href="@{/}">
        <div class="brand-mark">栖</div>
        <div class="brand-text"><strong>栖舍</strong><span>大学宿舍管理系统</span></div>
      </a>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" th:href="@{/register}">去注册</a>
      </div>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>欢迎回来</h1>
      <p class="lead">使用学号 / 工号登录宿舍服务</p>
      <p th:if="${error}" style="color:#c0392b;margin-bottom:12px;font-size:14px">账号或密码错误</p>
      <p th:if="${errorMsg}" style="color:#c0392b;margin-bottom:12px;font-size:14px" th:text="${errorMsg}"></p>
      <form th:action="@{/doLogin}" method="post">
        <input type="hidden" name="redirect" th:value="${redirect}">
        <div class="form-group">
          <label>账号</label>
          <input class="form-control" name="username" placeholder="学号或登录名" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-control" name="password" type="password" placeholder="请输入密码" required>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">登录</button>
        </div>
      </form>
      <p class="form-tip">还没有账号？<a th:href="@{/register}">立即注册</a> · 管理员请走 <a th:href="@{/admin/login}">后台入口</a></p>
    </div>
  </div>
</body>
</html>
