<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>入住指南 · 栖舍</title>
  <link th:href="@{/css/front.css}" rel="stylesheet">
</head>
<body>
<header th:replace="~{front/fragments/nav :: nav('guide')}"></header>
<div class="container page-banner"><h1>入住指南</h1><p>生活作息、安全规范与报修流程</p></div>
<main class="section" style="padding-top:8px">
  <div class="container" style="display:grid;gap:16px;max-width:860px">
    <div class="card">
      <h2 style="font-family:var(--font-brand);font-size:24px;font-weight:400;margin-bottom:10px">门禁与作息</h2>
      <p style="color:var(--ink-soft)">宿舍统一门禁时间为 <strong th:text="${configs != null and configs['curfew_time'] != null} ? ${configs['curfew_time']} : '23:00'">23:00</strong>。晚归请提前在系统登记。</p>
    </div>
    <div class="card">
      <h2 style="font-family:var(--font-brand);font-size:24px;font-weight:400;margin-bottom:10px">服务热线</h2>
      <p style="color:var(--ink-soft)" th:text="${configs != null and configs['hotline'] != null} ? ${configs['hotline']} : '400-800-2026'">热线</p>
    </div>
    <div class="card">
      <h2 style="font-family:var(--font-brand);font-size:24px;font-weight:400;margin-bottom:10px">禁止事项</h2>
      <p style="color:var(--ink-soft)">严禁使用热得快、电炉等违章电器；禁止高空抛物；楼道勿堆放杂物；外来访客需登记。</p>
    </div>
  </div>
</main>
</body>
</html>
