<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · 栖舍</title>
  <link th:href="@{/css/front.css}" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="brand" th:href="@{/}">
        <div class="brand-mark">栖</div>
        <div class="brand-text"><strong>栖舍</strong><span>大学宿舍管理系统</span></div>
      </a>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" th:href="@{/login}">去登录</a>
      </div>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>创建账号</h1>
      <p class="lead">学生注册后可查询宿舍、报修与请假</p>
      <p th:if="${errorMsg}" style="color:#c0392b;margin-bottom:12px;font-size:14px" th:text="${errorMsg}"></p>
      <p th:if="${allowRegister == false}" style="color:#c0392b;margin-bottom:12px;font-size:14px">系统暂未开放注册</p>
      <form th:action="@{/doRegister}" method="post" th:if="${allowRegister != false}">
        <div class="form-row">
          <div class="form-group">
            <label>学号</label>
            <input class="form-control" name="username" placeholder="如 2021001" required>
          </div>
          <div class="form-group">
            <label>姓名</label>
            <input class="form-control" name="realName" required>
          </div>
        </div>
        <div class="form-group">
          <label>手机号</label>
          <input class="form-control" name="phone">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-control" name="password" type="password" required>
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input class="form-control" name="confirm" type="password" required>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">注册并登录</button>
        </div>
      </form>
      <p class="form-tip">已有账号？<a th:href="@{/login}">直接登录</a></p>
    </div>
  </div>
</body>
</html>
