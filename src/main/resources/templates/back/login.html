<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录 · 栖舍</title>
  <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body class="admin-login-body">
  <div class="login-box">
    <div class="logo">栖</div>
    <h1>管理后台</h1>
    <p class="sub">大学宿舍管理系统 · 管理员入口</p>
    <p th:if="${error}" style="color:#c0392b;font-size:13px;margin-bottom:10px">账号或密码错误，或无管理员权限</p>
    <form th:action="@{/doLogin}" method="post">
      <input type="hidden" name="redirect" value="/admin">
      <div class="form-group">
        <label>账号</label>
        <input class="form-control" name="username" value="admin" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="form-control" name="password" type="password" value="123456" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">登录后台</button>
    </form>
    <p style="margin-top:16px;text-align:center;font-size:13px;color:var(--muted)">
      <a th:href="@{/}">返回前台</a>
    </p>
  </div>
</body>
</html>
