<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>报修管理 · 栖舍后台</title>
  <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{back/fragments/side :: side('repair')}"></aside>
  <main class="admin-main">
    <div class="admin-top"><h1>报修工单</h1></div>
    <div class="panel">
      <table class="data">
        <thead><tr><th>标题</th><th>学生ID</th><th>类别</th><th>状态</th><th>处理</th></tr></thead>
        <tbody>
          <tr th:each="r : ${list}">
            <td>
              <div th:text="${r.title}">标题</div>
              <div style="font-size:12px;color:#6b7c8a" th:text="${r.description}">描述</div>
            </td>
            <td th:text="${r.studentId}">1</td>
            <td th:text="${r.category}">水电</td>
            <td th:text="${r.status==0?'待处理':(r.status==1?'处理中':(r.status==2?'已完成':'已关闭'))}">状态</td>
            <td>
              <form th:action="@{/admin/repairs/update}" method="post" style="display:flex;gap:6px;flex-wrap:wrap">
                <input type="hidden" name="id" th:value="${r.id}">
                <select class="form-control" name="status" style="height:32px;min-width:100px">
                  <option value="0">待处理</option>
                  <option value="1">处理中</option>
                  <option value="2">已完成</option>
                  <option value="3">已关闭</option>
                </select>
                <input class="form-control" name="reply" placeholder="回复" style="height:32px;min-width:140px" th:value="${r.reply}">
                <button class="btn btn-primary btn-sm" type="submit">更新</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
