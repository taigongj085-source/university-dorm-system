<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>公告管理 · 栖舍后台</title>
  <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{back/fragments/side :: side('notice')}"></aside>
  <main class="admin-main">
    <div class="admin-top"><h1>公告管理</h1></div>
    <div class="panel">
      <form class="form-grid" th:action="@{/admin/notices/save}" method="post">
        <div class="form-group"><label>标题</label><input class="form-control" name="title" required></div>
        <div class="form-group"><label>分类</label>
          <select class="form-control" name="category"><option>通知</option><option>安全</option><option>活动</option><option>维修</option></select>
        </div>
        <div class="form-group"><label>发布人</label><input class="form-control" name="publisher" value="宿管中心"></div>
        <div class="form-group"><label>置顶</label>
          <select class="form-control" name="isTop"><option value="0">否</option><option value="1">是</option></select>
        </div>
        <div class="form-group full"><label>内容</label><textarea class="form-control" name="content" required></textarea></div>
        <input type="hidden" name="status" value="1">
        <div class="full"><button class="btn btn-primary" type="submit">发布公告</button></div>
      </form>
    </div>
    <div class="panel">
      <table class="data">
        <thead><tr><th>标题</th><th>分类</th><th>置顶</th><th>时间</th><th>操作</th></tr></thead>
        <tbody>
          <tr th:each="n : ${list}">
            <td th:text="${n.title}">标题</td>
            <td th:text="${n.category}">分类</td>
            <td th:text="${n.isTop==1?'是':'否'}">否</td>
            <td th:text="${n.createTime != null ? #temporals.format(n.createTime,'yyyy-MM-dd') : ''}">日期</td>
            <td>
              <form th:action="@{/admin/notices/delete/{id}(id=${n.id})}" method="post">
                <button class="btn btn-danger btn-sm" type="submit">删除</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
