<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>访客登记 · 栖舍后台</title>
  <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{back/fragments/side :: side('visitor')}"></aside>
  <main class="admin-main">
    <div class="admin-top"><h1>访客登记</h1></div>
    <div class="panel">
      <form class="form-grid" th:action="@{/admin/visitors/save}" method="post">
        <div class="form-group"><label>被访学生</label>
          <select class="form-control" name="studentId" required>
            <option th:each="s : ${students}" th:value="${s.id}" th:text="${s.name}">学生</option>
          </select>
        </div>
        <div class="form-group"><label>访客姓名</label><input class="form-control" name="visitorName" required></div>
        <div class="form-group"><label>电话</label><input class="form-control" name="visitorPhone"></div>
        <div class="form-group"><label>证件后四位</label><input class="form-control" name="idCardTail"></div>
        <div class="form-group full"><label>事由</label><input class="form-control" name="reason" required></div>
        <div class="full"><button class="btn btn-primary" type="submit">登记</button></div>
      </form>
    </div>
    <div class="panel">
      <table class="data">
        <thead><tr><th>学生ID</th><th>访客</th><th>事由</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
          <tr th:each="v : ${list}">
            <td th:text="${v.studentId}">1</td>
            <td th:text="${v.visitorName}">访客</td>
            <td th:text="${v.reason}">事由</td>
            <td th:text="${v.status==0?'在访':(v.status==1?'已离开':'已取消')}">状态</td>
            <td>
              <form th:if="${v.status==0}" th:action="@{/admin/visitors/leave/{id}(id=${v.id})}" method="post">
                <button class="btn btn-ghost btn-sm" type="submit">标记离开</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
