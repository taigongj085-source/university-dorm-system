<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<body>
<aside class="admin-side" th:fragment="side(menu)">

    <div class="mark">栖</div>
    <div><strong>栖舍后台</strong><span>Dorm Admin</span></div>
  </div>
  <nav class="side-nav">
    <div class="group">总览</div>
    <a th:href="@{/admin}" th:classappend="${menu=='dashboard'}?' active'">仪表盘</a>
    <div class="group">宿舍资源</div>
    <a th:href="@{/admin/buildings}" th:classappend="${menu=='building'}?' active'">楼栋管理</a>
    <a th:href="@{/admin/rooms}" th:classappend="${menu=='room'}?' active'">房间管理</a>
    <a th:href="@{/admin/beds}" th:classappend="${menu=='bed'}?' active'">床位入住</a>

    <div class="group">系统</div>
    <a th:href="@{/admin/settings}" th:classappend="${menu=='settings'}?' active'">系统设置</a>
    <a th:href="@{/}" target="_blank">打开前台</a>
    <a th:href="@{/logout}">退出登录</a>
  </nav>
</aside>
</body>
</html>
