<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>教师管理 · 栖舍后台</title>
  <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
<div class="admin-layout">
  <aside th:replace="~{back/fragments/side :: side('teacher')}"></aside>
  <main class="admin-main">
    <div class="admin-top"><h1>教师管理</h1></div>
    <div class="panel">
      <form class="form-grid" th:action="@{/admin/teachers/save}" method="post">
        <div class="form-group"><label>工号</label><input class="form-control" name="teacherNo" required></div>
        <div class="form-group"><label>姓名</label><input class="form-control" name="name" required></div>
        <div class="form-group"><label>性别</label><select class="form-control" name="gender"><option value="1">男</option><option value="2">女</option></select></div>
        <div class="form-group"><label>手机</label><input class="form-control" name="phone"></div>
        <div class="form-group"><label>学院</label><input class="form-control" name="college"></div>
        <div class="form-group"><label>职务</label><input class="form-control" name="title" value="辅导员"></div>
        <input type="hidden" name="status" value="1">
        <div class="full"><button class="btn btn-primary" type="submit">新增教师</button></div>
      </form>
    </div>
    <div class="panel">
      <table class="data">
        <thead><tr><th>工号</th><th>姓名</th><th>学院</th><th>职务</th><th>电话</th><th>状态</th></tr></thead>
        <tbody>
          <tr th:each="t : ${list}">
            <td th:text="${t.teacherNo}">工号</td>
            <td th:text="${t.name}">姓名</td>
            <td th:text="${t.college}">学院</td>
            <td th:text="${t.title}">职务</td>
            <td th:text="${t.phone}">电话</td>
            <td th:text="${t.status==1?'在职':'离职'}">在职</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
</body>
</html>
