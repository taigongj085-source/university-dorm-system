<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楼栋管理 · 栖舍后台</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-side">
    <div class="side-brand"><div class="mark">栖</div><div><strong>栖舍后台</strong><span>Dorm Admin</span></div></div>
    <nav class="side-nav">
      <div class="group">总览</div>
      <a href="index.html">工作台</a>
      <div class="group">宿舍资源</div>
      <a class="active" href="building.html">楼栋管理</a>
      <a href="room.html">房间管理</a>
      <a href="bed.html">床位入住</a>
      <div class="group">人员</div>
      <a href="student.html">学生管理</a>
      <a href="teacher.html">教师管理</a>
      <a href="user.html">账号管理</a>
      <div class="group">日常事务</div>
      <a href="notice.html">公告管理</a>
      <a href="repair.html">报修工单</a>
      <a href="leave.html">请假晚归</a>
      <a href="visitor.html">访客登记</a>
      <a href="hygiene.html">卫生检查</a>
      <div class="group">系统</div>
      <a href="settings.html">⚙️ 系统设置</a>
      <a href="../front/index.html" target="_blank">打开前台</a>
      <a href="login.html">退出登录</a>
    </nav>
  </aside>
  <main class="admin-main">
    <div class="admin-top">
      <h1>楼栋管理</h1>
      <button class="btn btn-primary btn-sm" type="button" onclick="document.getElementById('editPanel').style.display='block'">新增楼栋</button>
    </div>

    <div class="panel" id="editPanel" style="display:none">
      <div class="panel-head"><h2>编辑楼栋</h2><button class="btn btn-ghost btn-sm" type="button" onclick="this.closest('.panel').style.display='none'">收起</button></div>
      <form class="form-grid" data-demo data-success="楼栋信息已保存">
        <div class="form-group"><label>楼栋名称</label><input class="form-control" name="name" value="梅园1号楼" required></div>
        <div class="form-group"><label>楼栋编号</label><input class="form-control" name="code" value="MY-01" required></div>
        <div class="form-group"><label>类型</label>
          <select class="form-control" name="gender_type">
            <option value="1">男寝</option><option value="2">女寝</option><option value="3">混合</option>
          </select>
        </div>
        <div class="form-group"><label>楼层数</label><input class="form-control" type="number" name="floors" value="6"></div>
        <div class="form-group"><label>宿管姓名</label><input class="form-control" name="manager_name" value="刘阿姨"></div>
        <div class="form-group"><label>宿管电话</label><input class="form-control" name="manager_phone" value="13700001111"></div>
        <div class="form-group full"><label>位置描述</label><input class="form-control" name="address" value="东区梅园路1号"></div>
        <div class="full"><button class="btn btn-primary" type="submit">保存</button></div>
      </form>
    </div>

    <div class="panel">
      <div class="toolbar">
        <input class="form-control" placeholder="搜索楼栋名称 / 编号">
        <select class="form-control"><option>全部类型</option><option>男寝</option><option>女寝</option></select>
        <button class="btn btn-ghost btn-sm" type="button">查询</button>
      </div>
      <table class="data">
        <thead>
          <tr><th>编号</th><th>名称</th><th>类型</th><th>楼层</th><th>宿管</th><th>电话</th><th>状态</th><th>操作</th></tr>
        </thead>
        <tbody>
          <tr>
            <td>MY-01</td><td>梅园1号楼</td><td>男寝</td><td>6</td><td>刘阿姨</td><td>13700001111</td>
            <td><span class="badge badge-ok">启用</span></td>
            <td class="actions">
              <a class="btn btn-ghost btn-sm" href="room.html">房间</a>
              <button class="btn btn-ghost btn-sm" type="button">编辑</button>
            </td>
          </tr>
          <tr>
            <td>LY-02</td><td>兰园2号楼</td><td>女寝</td><td>6</td><td>赵阿姨</td><td>13700002222</td>
            <td><span class="badge badge-ok">启用</span></td>
            <td class="actions">
              <a class="btn btn-ghost btn-sm" href="room.html">房间</a>
              <button class="btn btn-ghost btn-sm" type="button">编辑</button>
            </td>
          </tr>
          <tr>
            <td>ZY-03</td><td>竹园3号楼</td><td>男寝</td><td>8</td><td>孙师傅</td><td>13700003333</td>
            <td><span class="badge badge-ok">启用</span></td>
            <td class="actions">
              <a class="btn btn-ghost btn-sm" href="room.html">房间</a>
              <button class="btn btn-ghost btn-sm" type="button">编辑</button>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="pager"><span>共 3 条</span><button class="btn btn-ghost btn-sm" type="button">上一页</button><button class="btn btn-ghost btn-sm" type="button">下一页</button></div>
    </div>
  </main>
</div>
<script src="../js/common.js"></script>
</body>
</html>
