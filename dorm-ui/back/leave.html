<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>请假晚归 · 栖舍后台</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-side">
    <div class="side-brand"><div class="mark">栖</div><div><strong>栖舍后台</strong><span>Dorm Admin</span></div></div>
    <nav class="side-nav">
      <div class="group">总览</div>
      <a href="index.html">工作台</a>
      <div class="group">宿舍资源</div>
      <a href="building.html">楼栋管理</a>
      <a href="room.html">房间管理</a>
      <a href="bed.html">床位入住</a>
      <div class="group">人员</div>
      <a href="student.html">学生管理</a>
      <a href="teacher.html">教师管理</a>
      <a href="user.html">账号管理</a>
      <div class="group">日常事务</div>
      <a href="notice.html">公告管理</a>
      <a href="repair.html">报修工单</a>
      <a class="active" href="leave.html">请假晚归</a>
      <a href="visitor.html">访客登记</a>
      <a href="hygiene.html">卫生检查</a>
      <div class="group">系统</div>
      <a href="settings.html">⚙️ 系统设置</a>
      <a href="../front/index.html" target="_blank">打开前台</a>
      <a href="login.html">退出登录</a>
    </nav>
  </aside>
  <main class="admin-main">
    <div class="admin-top">
      <h1>请假 / 晚归审核</h1>
      <div class="user">待审核 1 条</div>
    </div>
    <div class="panel" id="auditPanel" style="display:none">
      <div class="panel-head"><h2>审核意见</h2><button class="btn btn-ghost btn-sm" type="button" onclick="this.closest('.panel').style.display='none'">收起</button></div>
      <form class="form-grid" data-demo data-success="审核已提交">
        <div class="form-group"><label>审核结果</label>
          <select class="form-control"><option>通过</option><option>驳回</option></select>
        </div>
        <div class="form-group full"><label>备注</label><textarea class="form-control" rows="3">同意请假，注意返校安全。</textarea></div>
        <div class="full"><button class="btn btn-primary" type="submit">提交审核</button></div>
      </form>
    </div>
    <div class="panel">
      <div class="toolbar">
        <select class="form-control"><option>全部类型</option><option>请假</option><option>晚归</option><option>临时外出</option></select>
        <select class="form-control"><option>全部状态</option><option>待审核</option><option>已通过</option><option>已驳回</option></select>
        <button class="btn btn-ghost btn-sm" type="button">查询</button>
      </div>
      <table class="data">
        <thead><tr><th>学生</th><th>类型</th><th>事由</th><th>起止时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
          <tr>
            <td>陈浩</td><td>晚归</td><td>实验室项目加班</td><td>03-15 23:10 ~ 23:40</td>
            <td><span class="badge badge-warn">待审核</span></td>
            <td class="actions"><button class="btn btn-primary btn-sm" type="button" onclick="document.getElementById('auditPanel').style.display='block'">审核</button></td>
          </tr>
          <tr>
            <td>张晓明</td><td>请假</td><td>回家办事</td><td>03-20 08:00 ~ 03-22 20:00</td>
            <td><span class="badge badge-ok">已通过</span></td>
            <td class="actions"><button class="btn btn-ghost btn-sm" type="button">详情</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<script src="../js/common.js"></script>
</body>
</html>
