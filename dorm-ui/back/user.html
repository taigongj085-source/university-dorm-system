<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号管理 · 栖舍后台</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-side">
    <div class="side-brand"><div class="mark">栖</div><div><strong>栖舍后台</strong><span>Dorm Admin</span></div></div>
    <nav class="side-nav">
      <div class="group">总览</div>
      <a href="index.html">工作台</a>
      <div class="group">宿舍资源</div>
      <a href="building.html">楼栋管理</a>
      <a href="room.html">房间管理</a>
      <a href="bed.html">床位入住</a>
      <div class="group">人员</div>
      <a href="student.html">学生管理</a>
      <a href="teacher.html">教师管理</a>
      <a class="active" href="user.html">账号管理</a>
      <div class="group">日常事务</div>
      <a href="notice.html">公告管理</a>
      <a href="repair.html">报修工单</a>
      <a href="leave.html">请假晚归</a>
      <a href="visitor.html">访客登记</a>
      <a href="hygiene.html">卫生检查</a>
      <div class="group">系统</div>
      <a href="settings.html">⚙️ 系统设置</a>
      <a href="../front/index.html" target="_blank">打开前台</a>
      <a href="login.html">退出登录</a>
    </nav>
  </aside>
  <main class="admin-main">
    <div class="admin-top">
      <h1>账号管理</h1>
      <button class="btn btn-primary btn-sm" type="button" onclick="document.getElementById('editPanel').style.display='block'">新增账号</button>
    </div>
    <div class="panel" id="editPanel" style="display:none">
      <div class="panel-head"><h2>编辑账号</h2><button class="btn btn-ghost btn-sm" type="button" onclick="this.closest('.panel').style.display='none'">收起</button></div>
      <form class="form-grid" data-demo data-success="账号已保存">
        <div class="form-group"><label>登录名</label><input class="form-control" required></div>
        <div class="form-group"><label>真实姓名</label><input class="form-control"></div>
        <div class="form-group"><label>角色</label>
          <select class="form-control"><option>ADMIN</option><option>TEACHER</option><option>STUDENT</option></select>
        </div>
        <div class="form-group"><label>手机号</label><input class="form-control"></div>
        <div class="form-group"><label>初始密码</label><input class="form-control" type="password" value="123456"></div>
        <div class="form-group"><label>状态</label><select class="form-control"><option>正常</option><option>禁用</option></select></div>
        <div class="full"><button class="btn btn-primary" type="submit">保存</button></div>
      </form>
    </div>
    <div class="panel">
      <div class="toolbar">
        <input class="form-control" placeholder="登录名 / 姓名">
        <select class="form-control"><option>全部角色</option><option>ADMIN</option><option>TEACHER</option><option>STUDENT</option></select>
        <button class="btn btn-ghost btn-sm" type="button">查询</button>
      </div>
      <table class="data">
        <thead><tr><th>头像</th><th>登录名</th><th>姓名</th><th>角色</th><th>手机号</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
          <tr>
            <td>🛡️</td><td>admin</td><td>系统管理员</td><td><span class="badge badge-info">ADMIN</span></td><td>13800000000</td>
            <td><span class="badge badge-ok">正常</span></td>
            <td class="actions"><button class="btn btn-ghost btn-sm" type="button">重置密码</button></td>
          </tr>
          <tr>
            <td>👩‍🏫</td><td>teacher01</td><td>王老师</td><td><span class="badge badge-info">TEACHER</span></td><td>13800000001</td>
            <td><span class="badge badge-ok">正常</span></td>
            <td class="actions"><button class="btn btn-ghost btn-sm" type="button">重置密码</button></td>
          </tr>
          <tr>
            <td>👨‍🎓</td><td>2021001</td><td>张晓明</td><td><span class="badge badge-off">STUDENT</span></td><td>13900000001</td>
            <td><span class="badge badge-ok">正常</span></td>
            <td class="actions"><button class="btn btn-ghost btn-sm" type="button">重置密码</button><button class="btn btn-danger btn-sm" type="button">禁用</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<script src="../js/common.js"></script>
</body>
</html>
