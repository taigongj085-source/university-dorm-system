<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录 · 栖舍</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-login-body">
  <div class="login-box">
    <div class="logo">栖</div>
    <h1>管理后台</h1>
    <p class="sub">大学宿舍管理系统 · 管理员入口</p>
    <form action="index.html" method="get">
      <div class="form-group">
        <label for="username">账号</label>
        <input class="form-control" id="username" name="username" value="admin" required>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <input class="form-control" id="password" name="password" type="password" value="123456" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">登录后台</button>
    </form>
    <p style="margin-top:16px;text-align:center;font-size:13px;color:var(--muted)">
      <a href="../front/index.html">返回前台</a>
    </p>
  </div>
</body>
</html>
