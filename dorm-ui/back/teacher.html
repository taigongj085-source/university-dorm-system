<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教师管理 · 栖舍后台</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-side">
    <div class="side-brand"><div class="mark">栖</div><div><strong>栖舍后台</strong><span>Dorm Admin</span></div></div>
    <nav class="side-nav">
      <div class="group">总览</div>
      <a href="index.html">工作台</a>
      <div class="group">宿舍资源</div>
      <a href="building.html">楼栋管理</a>
      <a href="room.html">房间管理</a>
      <a href="bed.html">床位入住</a>
      <div class="group">人员</div>
      <a href="student.html">学生管理</a>
      <a class="active" href="teacher.html">教师管理</a>
      <a href="user.html">账号管理</a>
      <div class="group">日常事务</div>
      <a href="notice.html">公告管理</a>
      <a href="repair.html">报修工单</a>
      <a href="leave.html">请假晚归</a>
      <a href="visitor.html">访客登记</a>
      <a href="hygiene.html">卫生检查</a>
      <div class="group">系统</div>
      <a href="settings.html">⚙️ 系统设置</a>
      <a href="../front/index.html" target="_blank">打开前台</a>
      <a href="login.html">退出登录</a>
    </nav>
  </aside>
  <main class="admin-main">
    <div class="admin-top">
      <h1>教师 / 辅导员</h1>
      <button class="btn btn-primary btn-sm" type="button" onclick="document.getElementById('editPanel').style.display='block'">新增教师</button>
    </div>
    <div class="panel" id="editPanel" style="display:none">
      <div class="panel-head"><h2>编辑教师</h2><button class="btn btn-ghost btn-sm" type="button" onclick="this.closest('.panel').style.display='none'">收起</button></div>
      <form class="form-grid" data-demo data-success="教师信息已保存">
        <div class="form-group"><label>工号</label><input class="form-control" value="T2021001" required></div>
        <div class="form-group"><label>姓名</label><input class="form-control" value="王老师" required></div>
        <div class="form-group"><label>性别</label><select class="form-control"><option>女</option><option>男</option></select></div>
        <div class="form-group"><label>手机号</label><input class="form-control" value="13800000001"></div>
        <div class="form-group"><label>学院</label><input class="form-control" value="计算机学院"></div>
        <div class="form-group"><label>职务</label><input class="form-control" value="辅导员"></div>
        <div class="full"><button class="btn btn-primary" type="submit">保存</button></div>
      </form>
    </div>
    <div class="panel">
      <div class="toolbar">
        <input class="form-control" placeholder="工号 / 姓名">
        <button class="btn btn-ghost btn-sm" type="button">查询</button>
      </div>
      <table class="data">
        <thead><tr><th>工号</th><th>姓名</th><th>性别</th><th>学院</th><th>职务</th><th>电话</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
          <tr>
            <td>T2021001</td><td>王老师</td><td>女</td><td>计算机学院</td><td>辅导员</td><td>13800000001</td>
            <td><span class="badge badge-ok">在职</span></td>
            <td class="actions"><button class="btn btn-ghost btn-sm" type="button">编辑</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<script src="../js/common.js"></script>
</body>
</html>
