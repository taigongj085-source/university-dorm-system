<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告管理 · 栖舍后台</title>
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="admin-layout">
  <aside class="admin-side">
    <div class="side-brand"><div class="mark">栖</div><div><strong>栖舍后台</strong><span>Dorm Admin</span></div></div>
    <nav class="side-nav">
      <div class="group">总览</div>
      <a href="index.html">工作台</a>
      <div class="group">宿舍资源</div>
      <a href="building.html">楼栋管理</a>
      <a href="room.html">房间管理</a>
      <a href="bed.html">床位入住</a>
      <div class="group">人员</div>
      <a href="student.html">学生管理</a>
      <a href="teacher.html">教师管理</a>
      <a href="user.html">账号管理</a>
      <div class="group">日常事务</div>
      <a class="active" href="notice.html">公告管理</a>
      <a href="repair.html">报修工单</a>
      <a href="leave.html">请假晚归</a>
      <a href="visitor.html">访客登记</a>
      <a href="hygiene.html">卫生检查</a>
      <div class="group">系统</div>
      <a href="settings.html">⚙️ 系统设置</a>
      <a href="../front/index.html" target="_blank">打开前台</a>
      <a href="login.html">退出登录</a>
    </nav>
  </aside>
  <main class="admin-main">
    <div class="admin-top">
      <h1>公告管理</h1>
      <button class="btn btn-primary btn-sm" type="button" onclick="document.getElementById('editPanel').style.display='block'">发布公告</button>
    </div>
    <div class="panel" id="editPanel" style="display:none">
      <div class="panel-head"><h2>编辑公告</h2><button class="btn btn-ghost btn-sm" type="button" onclick="this.closest('.panel').style.display='none'">收起</button></div>
      <form class="form-grid" data-demo data-success="公告已发布">
        <div class="form-group full"><label>标题</label><input class="form-control" required placeholder="请输入公告标题"></div>
        <div class="form-group"><label>分类</label>
          <select class="form-control"><option>通知</option><option>安全</option><option>活动</option><option>维修</option></select>
        </div>
        <div class="form-group"><label>是否置顶</label>
          <select class="form-control"><option value="0">否</option><option value="1">是</option></select>
        </div>
        <div class="form-group full"><label>内容</label><textarea class="form-control" rows="5" required></textarea></div>
        <div class="full"><button class="btn btn-primary" type="submit">发布</button></div>
      </form>
    </div>
    <div class="panel">
      <div class="toolbar">
        <input class="form-control" placeholder="搜索标题">
        <select class="form-control"><option>全部分类</option><option>通知</option><option>安全</option><option>活动</option></select>
        <button class="btn btn-ghost btn-sm" type="button">查询</button>
      </div>
      <table class="data">
        <thead><tr><th>标题</th><th>分类</th><th>置顶</th><th>发布人</th><th>状态</th><th>时间</th><th>操作</th></tr></thead>
        <tbody>
          <tr>
            <td>关于2026年春季学期宿舍安全检查的通知</td>
            <td><span class="badge badge-warn">安全</span></td>
            <td>是</td><td>宿管中心</td>
            <td><span class="badge badge-ok">已发布</span></td>
            <td>2026-03-10</td>
            <td class="actions"><button class="btn btn-ghost btn-sm" type="button">编辑</button><button class="btn btn-danger btn-sm" type="button" data-confirm="确认删除？">删除</button></td>
          </tr>
          <tr>
            <td>热水供应时间调整公告</td>
            <td><span class="badge badge-info">通知</span></td>
            <td>否</td><td>后勤处</td>
            <td><span class="badge badge-ok">已发布</span></td>
            <td>2026-03-08</td>
            <td class="actions"><button class="btn btn-ghost btn-sm" type="button">编辑</button><button class="btn btn-danger btn-sm" type="button" data-confirm="确认删除？">删除</button></td>
          </tr>
          <tr>
            <td>宿舍文化节报名开始</td>
            <td><span class="badge badge-ok">活动</span></td>
            <td>否</td><td>学生处</td>
            <td><span class="badge badge-ok">已发布</span></td>
            <td>2026-03-05</td>
            <td class="actions"><button class="btn btn-ghost btn-sm" type="button">编辑</button><button class="btn btn-danger btn-sm" type="button" data-confirm="确认删除？">删除</button></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<script src="../js/common.js"></script>
</body>
</html>
