<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 栖舍</title>
  <link rel="stylesheet" href="../css/front.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <div class="brand-mark">栖</div>
        <div class="brand-text"><strong>栖舍</strong><span>大学宿舍管理系统</span></div>
      </a>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" href="register.html">去注册</a>
      </div>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>学生登录</h1>
      <p class="lead">使用学号账号进入宿舍服务中心</p>
      <form data-demo data-success="登录成功" data-jump="my-dorm.html">
        <div class="form-group">
          <label>账号</label>
          <input class="form-control" name="username" value="2021001" placeholder="学号 / 用户名" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input class="form-control" type="password" name="password" value="123456" required>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">登录</button>
        </div>
      </form>
      <p class="form-tip">还没有账号？<a href="register.html">立即注册</a> · 演示账号 2021001 / 123456</p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">栖舍 · 大学宿舍管理系统</div>
      <a href="../back/login.html">管理后台</a>
    </div>
  </footer>
  <script src="../js/common.js"></script>
</body>
</html>
