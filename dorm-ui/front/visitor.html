<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>访客登记 · 栖舍</title>
  <link rel="stylesheet" href="../css/front.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
            <a class="brand" href="index.html">
        <div class="brand-mark">栖</div>
        <div class="brand-text">
          <strong>栖舍</strong>
          <span>大学宿舍管理系统</span>
        </div>
      </a>
            <nav class="nav-links">
        <a  href="index.html">首页</a>
        <a  href="notices.html">公告</a>
        <a  href="my-dorm.html">我的宿舍</a>
        <a  href="repair.html">报修</a>
        <a  href="leave.html">请假</a>
        <a class="active" href="visitor.html">访客</a>
        <a  href="guide.html">入住指南</a>
      </nav>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" href="profile.html">个人中心</a>
      </div>
    </div>
  </header>

  <div class="container page-banner">
    <h1>访客登记</h1>
    <p>家长探望或同学来访请提前登记，离开后记得销访</p>
  </div>

  <main class="section" style="padding-top:8px">
    <div class="container stack-2">
      <div class="card">
        <h2 style="font-family:var(--font-brand);font-size:22px;font-weight:400;margin-bottom:16px">登记访客</h2>
        <form data-demo data-success="访客已登记">
          <div class="form-group">
            <label>访客姓名</label>
            <input class="form-control" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>访客电话</label>
              <input class="form-control">
            </div>
            <div class="form-group">
              <label>证件后四位</label>
              <input class="form-control" maxlength="4">
            </div>
          </div>
          <div class="form-group">
            <label>来访事由</label>
            <input class="form-control" placeholder="如：家长探望" required>
          </div>
          <div class="form-group">
            <label>预计来访时间</label>
            <input class="form-control" type="datetime-local">
          </div>
          <button class="btn btn-primary" type="submit">提交登记</button>
        </form>
      </div>

      <div class="card">
        <h2 style="font-family:var(--font-brand);font-size:22px;font-weight:400;margin-bottom:16px">我的访客记录</h2>
        <div class="table-wrap">
          <table class="data">
            <thead>
              <tr>
                <th>访客</th>
                <th>事由</th>
                <th>状态</th>
                <th>时间</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>王建国</td>
                <td>家长探望</td>
                <td><span class="status status-done">已离开</span></td>
                <td>03-16</td>
              </tr>
              <tr>
                <td>周小艺</td>
                <td>同学串门</td>
                <td><span class="status status-doing">在访</span></td>
                <td>03-18</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-brand">栖舍 · 大学宿舍管理系统</div>
      <div>服务热线 400-800-2026</div>
    </div>
  </footer>
  <script src="../js/common.js"></script>
</body>
</html>
