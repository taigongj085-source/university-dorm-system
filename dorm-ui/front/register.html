<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 · 栖舍</title>
  <link rel="stylesheet" href="../css/front.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <div class="brand-mark">栖</div>
        <div class="brand-text"><strong>栖舍</strong><span>大学宿舍管理系统</span></div>
      </a>
      <div class="nav-actions">
        <a class="btn btn-ghost btn-sm" href="login.html">去登录</a>
      </div>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>学生注册</h1>
      <p class="lead">注册后可绑定学籍信息，查询宿舍与办理事务</p>
      <form data-demo data-success="注册成功，请登录" data-jump="login.html">
        <div class="form-row">
          <div class="form-group">
            <label>学号 / 账号</label>
            <input class="form-control" name="username" required>
          </div>
          <div class="form-group">
            <label>真实姓名</label>
            <input class="form-control" name="realName" required>
          </div>
        </div>
        <div class="form-group">
          <label>手机号</label>
          <input class="form-control" name="phone" placeholder="用于接收通知">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>密码</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <div class="form-group">
            <label>确认密码</label>
            <input class="form-control" type="password" name="confirm" required>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" type="submit">注册</button>
        </div>
      </form>
      <p class="form-tip">已有账号？<a href="login.html">直接登录</a></p>
    </div>
  </div>
  <script src="../js/common.js"></script>
</body>
</html>
